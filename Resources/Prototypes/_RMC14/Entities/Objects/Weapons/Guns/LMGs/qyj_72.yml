  id: RMCCartridgeLMGQYJ72
  name: патрон (7.62x54ммР)
  description: Патрон 7.62x54ммР.
  components:
  - type: Tag
    tags:
    - Cartridge
    - RMCCartridgeLMGQYJ72
  - type: CartridgeAmmo
    proto: RMCBulletLMGQYJ72

- type: entity
