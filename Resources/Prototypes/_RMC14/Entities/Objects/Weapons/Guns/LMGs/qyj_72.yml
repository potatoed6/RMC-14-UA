- type: entity
  parent: RMCBaseWeaponLMG
  name: ЙУЖ-72 єдиний кулемет
  id: RMCWeaponLMGQYJ72
  description: ЙУЖ-72 (кит. 'Цян'їнцзі-72' - Орлиний кулемет)- штатний єдиний кулемет Соціалістичних Прогресивних Народів, розрахований на використання патронів калібру 7,62×54 мм R. Він використовує потужний набій і вирізняється високою скорострільністю. Завдяки місткому коробчастому магазину на 250 набоїв QYJ-72 призначений насамперед для ведення щільного придушувального вогню, забезпечуючи високу ефективність ураження цілей завдяки великій кількості пострілів.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_inhands.rsi
    layers:
    - state: base
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
    - state: bolt-open
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: cover-closed
      sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_icon.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/LMGs/qyj_72/qyj_72_inhands.rsi
  - type: Tag
    tags:
    - RMCWeaponLMGQYJ72
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    shotsPerBurst: 6
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - Burst
    - FullAuto
    recoilWielded: 1
    scatterWielded: 1
    baseFireRate: 3.33
    burstScatterMult: 3
    modifiers:
      Burst:
        fireDelay: 0.233
        maxScatterModifier: 10
        useBurstScatterMult: true
      FullAuto:
        maxScatterModifier: 6
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineLMGQYJ72
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineLMGQYJ72
  - type: GunDamageModifier
    multiplier: 1
  # - type: UniqueAction
  # - type: BreechLoaded
  #   needOpenClose: false
  # - type: Appearance
  # - type: GenericVisualizer
  #   visuals:
  #     enum.BreechVisuals.Open:
  #       enum.BreechVisuals.Open:
  #         True: { state: cover-open }
  #         False: { state: cover-closed }
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 40 # im not kidding, this is correct, bipod brings it down to 30
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        locked: true
        startingAttachable: RMCAttachmentBipodQYJ
        whitelist:
          tags:
          - RMCAttachmentBipodQYJ
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.27, -0.09
  - type: Wieldable
  - type: GunRequiresWield
  - type: RMCMagneticItem
  - type: GunUserWhitelist
    whitelist:
      components:
      - QYJWhitelist

- type: entity
  parent: RMCMagazineLMGBase
  id: RMCMagazineLMGQYJ72
  name: "ЙУЖ-72 коробка патронів (7.62x54ммР)"
  components:
  - type: Tag
    tags:
    - RMCMagazineLMG
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - RMCCartridgeLMGQYJ72
