- type: entity
  parent: CMCartridge10x20mmAP
  id: VehicleCartridgeLTAAAP
  name: постріл (10х20мм-АПК)
  components:
  - type: CartridgeAmmo
    proto: VehicleBulletLTAAAP

# Projectiles
- type: entity
  id: VehicleLTBCannonImpact
  name: КБА гармата влучання
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger
  - type: CMExplosionEffect
    minShrapnel: 20
    maxShrapnel: 60
    shrapnelSpeed: 8
  - type: RMCScorchEffect
    radius: 3
    centerRadius: 1
  - type: Explosive
    explosionType: RMCLTBCannon
    maxIntensity: 40
    intensitySlope: 18
    totalIntensity: 650
    tileBreakScale: 4
    maxTileBreak: 12

- type: entity
  parent: RMCBaseBullet
  id: RMCProjectileAceAutocannonFlak
  name: ЗТМ зенітний снаряд
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    drawdepth: Effects
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    maxFixedRange: 32
    damage:
      types:
        Piercing: 60
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: RMCProjectileAccuracy
    accuracy: 125
    thresholds:
    - range: 32
      falloff: 10
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 32
      falloff: 9999
      ignoreModifiers: true
  - type: RMCAreaDamage
    damageArea: 2
    falloffDistance: 0.67
    xenoDamageMultiplier: 2
  - type: CMArmorPiercing
    amount: 30
  - type: IgnorePredictionHide

- type: entity
  parent: RMCBaseBullet
  id: VehicleProjectileDragonFlame
  name: струя палива ДРКН
  categories: [ HideSpawnMenu ]
  components:
  - type: DeleteOnFixedDistanceStop
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: IgniteOnProjectileHit
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/firesentry_projectile.rsi
    drawdepth: Effects
    layers:
    - state: pulse0
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    impactEffect: null
    forceSound: true
    damage:
      types:
        Heat: 30
    soundHit: null
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: DeleteOnTrigger
  - type: SpawnOnTerminate
    spawn: VehicleDragonFlameImpact
    spawnOffset: 0.5
  - type: IgnoreArc
  - type: IgnorePredictionHide
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

- type: entity
  parent: Bullet10x20mmAP
  id: VehicleBulletLTAAAP
  name: куля (10х20мм-АПК)
  categories: [ HideSpawnMenu ]
  components:
