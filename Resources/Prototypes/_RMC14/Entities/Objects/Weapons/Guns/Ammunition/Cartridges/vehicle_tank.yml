- type: entity
  parent: CMBaseCartridgeRifle
  id: VehicleCartridgeLTBCannon
  name: постріл (КБА гармата)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: RMCProjectileLTBCannon
    muzzleFlash: MuzzleFlashEffectVehicleOverLarge
    muzzleFlashOffset: 2.2, 0

