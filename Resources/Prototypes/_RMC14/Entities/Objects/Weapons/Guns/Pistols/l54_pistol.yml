- type: entity
  parent: CMWeaponPistolM1984
  id: RMCWeaponPistolL54
  name: Л54 службовий пістолет # TSE service pistol - same stats as the M1984
  description: Стандартна полуавтоматична зброя ІТСПА. Заряджається 9мм набоями, та, загалом, нічим не відрізняється у ТТХ від М1984.
  components:
  - type: Tag
    tags:
    - Sidearm
    - RMCWeaponPistolL54
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mk80.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolL54
        startingItem: RMCMagazinePistolL54

- type: entity
  parent: RMCWeaponPistolL54
  id: RMCWeaponPistolL54Empty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazinePistolL54

- type: entity
  parent: RMCWeaponPistolL54
  id: RMCWeaponPistolL54Custom
  name: Л54 кастомний службовий пістолет
  description: Штатний самозарядний пістолет ІТСПА та низки інших військових формувань Імперії, розрахований на патрон калібру 9×20 мм. За своїми характеристиками він загалом відповідає пістолету M1984 Корпусу морської піхоти ОН. Цей екземпляр зазнав численних модифікацій - має оздоблення зі сплаву золота, подовжений ствол з інтегрованим компенсатором, прецизійно налаштований ударно-спусковий механізм та систему автоматичного викидання гільз. Завдяки цим удосконаленням його характеристики значно перевершують стандартні показники штатної моделі.
  components:
    - type: Sprite
      sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54_custom.rsi
    - type: Clothing
      sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54_custom.rsi
    - type: RMCWeaponAccuracy
      accuracyMultiplier: 1.5
    - type: GunDamageModifier
      multiplier: 1.25
    - type: ItemSlots
      slots:
        gun_magazine:
          insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
          ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
          whitelist:
            tags:
              - RMCMagazinePistolL54Custom
          startingItem: RMCMagazinePistolL54Custom

- type: entity
  parent: RMCWeaponPistolL54Custom
  id: RMCWeaponPistolL54CustomAlt
  suffix: Alt
  description: Штатний самозарядний пістолет ІТСПА та низки інших військових формувань Імперії, розрахований на патрон калібру 9×20 мм. За своїми характеристиками він загалом відповідає штатному пістолету M1984 Корпусу морської піхоти ОН. Цей екземпляр зазнав численних модифікацій - має покриття зі спеціального темного сплаву, подовжений ствол з інтегрованим компенсатором, прецизійно налаштований ударно-спусковий механізм, а також систему автоматичного викидання гільз. Завдяки цим удосконаленням його характеристики значно перевершують стандартні показники штатної моделі.
  components:
    - type: Sprite
      sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54_custom_alt.rsi
    - type: Clothing
      sprite: _RMC14/Objects/Weapons/Guns/Pistols/l54_custom_alt.rsi

